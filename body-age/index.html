<title>Cek Body Age · Alvacy</title>

<style>body{margin:0;background:#F8FAFC;font-family:system-ui,sans-serif}@media (prefers-color-scheme:dark){body{background:#0B1220}}</style>
<script>
/* Readable short link (alvacy.com/body-age) for AJ's Threads bio: remembers coach AJ,
   tags the visit as coming from Threads (unless the link carries utm_*), then opens the Body Age test. */
(function(){
  var q = location.search;
  try {
    localStorage.setItem('alv-coach', 'aj');
    if (!/utm_/.test(q)) localStorage.setItem('alv-src', JSON.stringify({source:'threads', medium:'bio', campaign:'', content:'body-age', landing:'/body-age'}));
  } catch (e) {}
  location.replace('../test/' + q + '#aj');
})();
</script>
<noscript><meta http-equiv="refresh" content="0; url=../test/"></noscript>
</head>
<body><noscript><a href="../test/">Cek Body Age</a></noscript></body>
</html>
