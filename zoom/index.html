<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta name="robots" content="noindex,nofollow">
<meta name="description" content="Book your time in the shared Zoom room.">
<meta name="theme-color" content="#1E3A8A">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
.zr{max-width:560px;margin:0 auto;padding:18px 16px 96px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
#view{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.card>*{min-width:0}
.kv .v{overflow-wrap:anywhere}
.zr header{display:grid;gap:4px;padding-top:6px}
.zr .brand{font-size:.82rem;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.zr h1{font-size:clamp(1.9rem,8vw,2.5rem)}
.zr .sub{color:var(--muted);font-size:.95rem}
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:16px;display:grid;gap:12px;box-shadow:var(--lift)}
.card h2{font-size:1.15rem;letter-spacing:-.02em;line-height:1.2}
.card.hl{background:var(--accent-soft);border-color:var(--sky-line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.btn{appearance:none;border:0;border-radius:999px;background:var(--cta);color:var(--cta-ink);font:600 .98rem var(--f-body);padding:12px 20px;min-height:46px;cursor:pointer}
.btn:hover{background:var(--cta-hover)}
.btn.ghost{background:transparent;color:var(--head);border:1.5px solid var(--sky-line)}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.warn{background:transparent;color:var(--bad);border:1.5px solid var(--bad)}
.btn.sm{min-height:38px;padding:8px 14px;font-size:.88rem}
.btn[disabled]{opacity:.45;cursor:default}
.banner{border-radius:16px;padding:12px 14px;font-size:.93rem;line-height:1.45;border:1px solid}
.banner.err{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.banner.warn{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.banner.ok{background:var(--good-soft);border-color:var(--good);color:var(--good)}
.banner button{margin-left:8px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:58px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:8px 6px;text-align:center;font:600 .85rem var(--f-body);cursor:pointer}
.day b{display:block;font-size:1.15rem;font-weight:800;color:var(--head)}
.day[aria-pressed=true]{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.day[aria-pressed=true] b{color:var(--cta-ink)}
.slots{display:grid;gap:6px}
.slot{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;min-height:50px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:600 1rem var(--f-body);text-align:left}
.slot .t{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.slot .s{font-size:.85rem;font-weight:600}
.slot.free{cursor:pointer;border-color:var(--sky-line);background:var(--accent-soft)}
.slot.free .s{color:var(--good)}
.slot.free:active{transform:scale(.99)}
.slot.busy{background:var(--sand);color:var(--muted);border-style:dashed}
.slot.closed{background:transparent;color:var(--muted);border-style:dotted;min-height:40px;opacity:.75}
.slot.mine{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.slot.mine .s{color:var(--cta-ink)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--sky-line);background:var(--surface);color:var(--head);border-radius:999px;padding:10px 16px;min-height:44px;font:600 .95rem var(--f-body);cursor:pointer}
.chip[aria-pressed=true]{background:var(--cta);color:var(--cta-ink);border-color:var(--cta)}
.chip[disabled]{opacity:.35;cursor:default;text-decoration:line-through}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,48,.45);display:flex;align-items:flex-end;justify-content:center;z-index:50}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:26px 26px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:88vh;overflow:auto}
.kv{display:grid;grid-template-columns:auto 1fr auto;gap:8px 12px;align-items:center}
.kv .k{color:var(--muted);font-size:.85rem}
.kv .v{font-family:var(--f-mono);word-break:break-all;font-size:.95rem}
.item{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;background:var(--sand);color:var(--muted)}
.tag.active{background:var(--good-soft);color:var(--good)}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tabs{display:flex;gap:6px;background:var(--sand);border-radius:999px;padding:4px}
.tabs button{flex:1;border:0;background:transparent;border-radius:999px;min-height:40px;font:700 .9rem var(--f-body);color:var(--muted);cursor:pointer}
.tabs button[aria-pressed=true]{background:var(--surface);color:var(--head);box-shadow:var(--lift)}
label.f{display:grid;gap:4px;font-weight:600;font-size:.88rem;color:var(--head)}
label.f input,label.f select,label.f textarea{font:500 1rem var(--f-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:11px 12px;min-height:46px;width:100%}
label.f textarea{min-height:72px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:.9rem}
.chk input{width:22px;height:22px;margin-top:2px}
.foot{color:var(--muted);font-size:.82rem;text-align:center;padding:6px 8px}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--sky-line);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;font:inherit;cursor:pointer}
.empty{padding:22px 8px;text-align:center;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>
</head>
<body>
<main class="zr" id="zr">
  <header>
    <div class="brand">#transformwithST</div>
    <h1>Zoom Room</h1>
    <div class="sub" id="sub">Loading…</div>
  </header>
  <div id="banner" role="alert" aria-live="polite"></div>
  <div id="view"></div>
  <div class="foot" id="foot"></div>
</main>
<div id="sheet"></div>

<script>
/* Zoom Room page. All rules are enforced by the server (apps-script/ZoomRoom.gs); this page only shows what the server sends.
   Members get their own bookings plus anonymous "Busy" ranges. Nothing about other people is ever sent to a member. */
const ZOOM_API = 'PASTE_ZOOM_API_URL_HERE';
const API_V = 2;
const MIN = 60000, HOUR = 3600000, DAY = 86400000, SLOT = 30 * MIN, WIB = 7 * HOUR;

/* ---------- tiny helpers ---------- */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') n.className = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
const $ = id => document.getElementById(id);
function put(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(Boolean)); }
const pad = n => String(n).padStart(2, '0');
const tzLabel = (() => { try { return new Intl.DateTimeFormat('en', { timeZoneName: 'short' }).formatToParts(new Date()).find(p => p.type === 'timeZoneName').value; } catch (e) { return 'your time'; } })();
function hm(ms) { const d = new Date(ms); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function dayName(ms, long) { return new Date(ms).toLocaleDateString('en-GB', long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short' }); }
function dur(min) { return min % 60 === 0 ? (min / 60) + ' h' : (min >= 60 ? Math.floor(min / 60) + ' h ' + (min % 60) + ' min' : min + ' min'); }
function localMidnight(ms) { const d = new Date(ms); return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }
function wibHour(ms) { return Math.floor((((ms + WIB) % DAY) + DAY) % DAY / HOUR); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }

/* ---------- state ---------- */
const S = { role: null, name: '', secret: '', adminKey: '', data: null, admin: null, day: 0, adminTab: 'schedule', skew: 0, lastOk: 0, offline: false };
const now = () => Date.now() + S.skew;

function readKeys() {
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('admin')) { store('zr-admin', h.get('admin')); store('zr-role', 'admin'); }
  S.adminKey = load('zr-admin'); S.name = load('zr-name'); S.secret = load('zr-secret');
  const saved = load('zr-role');
  S.role = (saved === 'admin' && S.adminKey) ? 'admin' : (S.name ? 'member' : (S.adminKey ? 'admin' : null));
}
function setRole(r) { S.role = r; store('zr-role', r); S.data = null; S.admin = null; banner(); render(); refresh(); }
function signOut() { S.name = ''; S.secret = ''; S.data = null; store('zr-name', null); store('zr-secret', null); banner(); S.role = S.adminKey ? 'admin' : null; boot(true); }

/* ---------- server calls ---------- */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(payload) {
  if (!ZOOM_API || ZOOM_API.indexOf('PASTE_') === 0) throw new ApiError('The booking server is not connected yet. Please tell the person who sent you this link.', 'SETUP');
  const auth = String(payload.a).indexOf('a_') === 0 ? { k: S.adminKey } : { n: S.name, s: S.secret };
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 25000);
  let text;
  try {
    const res = await fetch(ZOOM_API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign(auth, payload)), signal: ctl.signal, redirect: 'follow' });
    text = await res.text();
  } catch (e) {
    throw new ApiError(e && e.name === 'AbortError' ? 'The server took too long to answer. Nothing was changed. Please try again.' : 'Cannot reach the server. Check your internet connection. Nothing was changed.', 'NET');
  } finally { clearTimeout(timer); }
  let j;
  try { j = JSON.parse(text); } catch (e) { throw new ApiError('The server sent an unexpected reply, so it may be busy or down. Nothing was changed. Please try again in a minute.', 'HTML'); }
  if (!j.ok) throw new ApiError(j.msg || 'Something went wrong.', j.code);
  if (j.now) S.skew = j.now - Date.now();
  if (j.v && j.v !== API_V) throw new ApiError('This page is out of date. Please close it and open the link again.', 'VERSION');
  return j;
}
function banner(kind, msg, action) {
  const b = $('banner');
  if (!msg) { put(b); return; }
  put(b, el('div', { class: 'banner ' + kind }, msg, action || null));
}
function showError(e) {
  const msg = (e && e.message) || 'Something went wrong. Please try again.';
  if (e && (e.code === 'NET' || e.code === 'HTML')) { S.offline = true; banner('warn', msg + (S.data || S.admin ? ' Showing the last schedule received' + (S.lastOk ? ' at ' + hm(S.lastOk) : '') + '.' : '')); }
  else banner('err', msg, el('button', { class: 'btn sm ghost', onclick: () => banner() }, 'OK'));
}
function flash(msg, ms) { banner('ok', msg); setTimeout(() => { if ($('banner').textContent.indexOf(msg) === 0) banner(); }, ms || 4000); }

/* ---------- refresh ---------- */
async function refresh(silent) {
  if (!S.role) return;
  try {
    if (S.role === 'admin') S.admin = await api({ a: 'a_view' }); else S.data = await api({ a: 'view' });
    S.lastOk = Date.now(); if (S.offline) { S.offline = false; banner(); }
  } catch (e) {
    if (e.code === 'AUTH' && S.role === 'member') { S.data = null; const m = e.message; store('zr-secret', null); S.secret = ''; boot(true, m); return; }
    if (!silent || e.code !== 'NET') showError(e);
  }
  render();
}

/* ---------- sign in ---------- */
function signInView(msg) {
  put($('sub'), 'Book your time in the shared Zoom room.');
  let busy = false;
  const name = el('input', { type: 'text', autocomplete: 'name', autocapitalize: 'words', maxlength: 40, placeholder: 'Your full name', value: S.name || '' });
  const secret = el('input', { type: 'text', autocomplete: 'off', autocapitalize: 'none', maxlength: 40, placeholder: 'Optional' });
  const go = el('button', { class: 'btn', onclick: async () => {
    if (busy) return;
    const n = name.value.replace(/\s+/g, ' ').trim();
    if (n.length < 2) { banner('err', 'Please type your name (at least 2 letters).'); return; }
    busy = true; go.disabled = true; go.textContent = 'Checking…';
    S.name = n; S.secret = secret.value.trim();
    try { const r = await api({ a: 'join' }); S.name = r.name; store('zr-name', S.name); store('zr-secret', S.secret || null); store('zr-role', 'member'); S.role = 'member'; banner(); boot(true); }
    catch (e) { busy = false; go.disabled = false; go.textContent = 'Continue'; S.name = ''; S.secret = ''; showError(e); }
  } }, 'Continue');
  put($('view'), el('div', { class: 'card' }, el('h2', null, 'Who are you?'),
    el('div', { class: 'muted' }, 'Type your name once. Use the same name every time so your bookings stay together. Nobody else can see your name or your bookings.'),
    el('label', { class: 'f' }, 'Your name', name),
    el('label', { class: 'f' }, 'Secret word (optional)', secret),
    el('div', { class: 'small muted' }, 'Add a secret word if you want to stop someone else from using your name. You will need the same word on any other phone.'),
    go), S.adminKey ? el('div', { class: 'foot' }, el('button', { class: 'btn sm ghost', onclick: () => setRole('admin') }, 'Back to admin')) : null);
  if (msg) banner('err', msg);
  put($('foot'));
}

/* ---------- member view ---------- */
function liveMine() { return (S.data ? S.data.mine : []).filter(b => b.status === 'active' && b.end > now()); }
function slotsFor(dayStart) {
  const d = S.data, t0 = now(), r = d.rules, out = [];
  const date = new Date(dayStart).getDate();
  for (let t = dayStart; new Date(t).getDate() === date; t += SLOT) {
    if (t + SLOT <= t0) continue;
    const wh = wibHour(t);
    let state = 'free';
    if (wh < r.openStartHour || wh >= r.openEndHour) state = 'closed';
    else if (t > t0 + r.daysAhead * DAY) state = 'closed';
    else if (liveMine().some(b => b.start < t + SLOT && t < b.end)) state = 'mine';
    else if (d.busy.some(x => x[0] < t + SLOT && t < x[1])) state = 'busy';
    out.push({ t, state });
  }
  return out;
}
function memberHeader() {
  put($('sub'), el('span', null, 'Hi ' + S.data.name + '. Times are in your device time (' + tzLabel + '). '), el('button', { class: 'link', onclick: signOut }, 'Not you?'));
}
function renderMember() {
  const d = S.data;
  if (!d) { put($('view'), el('div', { class: 'empty' }, el('span', { class: 'spin' }), ' Loading your schedule…')); return; }
  memberHeader();
  const parts = [];
  if (S.adminKey) parts.push(roleSwitch('member'));
  parts.push(nextCard());
  parts.push(el('div', { class: 'days', role: 'group', 'aria-label': 'Pick a day' }, Array.from({ length: Math.min(d.rules.daysAhead, 14) }, (_, i) => {
    const ms = localMidnight(now()) + i * DAY;
    return el('button', { class: 'day', 'aria-pressed': String(S.day === i), onclick: () => { S.day = i; renderMember(); } }, i === 0 ? 'Today' : dayName(ms), el('b', null, new Date(ms).getDate()));
  })));
  const ms = localMidnight(now()) + S.day * DAY;
  const sl = slotsFor(ms);
  parts.push(el('div', { class: 'card' },
    el('div', { class: 'row sb' }, el('h2', null, dayName(ms, true)), el('span', { class: 'small muted' }, 'Open ' + pad(d.rules.openStartHour) + ':00 to ' + pad(d.rules.openEndHour) + ':00 WIB')),
    sl.length ? el('div', { class: 'slots' }, sl.map(slotRow)) : el('div', { class: 'empty' }, 'Nothing left to book today. Pick another day.'),
    el('div', { class: 'small muted' }, 'Busy means someone else has booked it. You only ever see your own bookings.')));
  parts.push(mineCard());
  put($('view'), parts);
  put($('foot'), S.lastOk ? 'Updated ' + hm(S.lastOk) + ' · refreshes every minute' : '');
}
function slotRow(s) {
  const label = { free: 'Free', busy: 'Busy', closed: 'Closed', mine: 'Yours' }[s.state];
  const tag = s.state === 'free' ? 'button' : 'div';
  return el(tag, { class: 'slot ' + s.state, type: tag === 'button' ? 'button' : null, onclick: s.state === 'free' ? () => openBook(s.t) : null }, el('span', { class: 't' }, hm(s.t)), el('span', { class: 's' }, label));
}
function nextCard() {
  const b = liveMine().sort((a, c) => a.start - c.start)[0], d = S.data;
  if (!b) return el('div', { class: 'card hl' }, el('h2', null, 'No session booked'), el('div', { class: 'muted' }, 'Pick a free time below. It is yours straight away, no need to ask anyone.'));
  const t = now(), live = b.start <= t && t < b.end;
  const left = Math.max(0, Math.round((b.end - t) / MIN)), toStart = Math.round((b.start - t) / MIN);
  const kids = [el('div', { class: 'row sb' }, el('h2', null, live ? 'Your session is on' : 'Your next session'), el('span', { class: 'tag active' }, live ? 'Now' : 'Booked')),
    el('div', null, el('div', { class: 'mono', style: 'font-size:1.35rem;font-weight:700' }, hm(b.start) + ' – ' + hm(b.end)), el('div', { class: 'muted' }, dayName(b.start, true) + (live ? ' · ' + left + ' min left' : toStart < 90 ? ' · starts in ' + Math.max(toStart, 0) + ' min' : '')))];
  if (live && left <= d.rules.wrapUpMin) kids.push(el('div', { class: 'banner warn' }, 'Ends in ' + left + ' min. Please wrap up so the next person can start on time.'));
  kids.push(el('div', { class: 'row' },
    live ? el('button', { class: 'btn sm', onclick: () => act('extend', b.id, 'Extended by 30 minutes.') }, '+30 min') : null,
    el('button', { class: 'btn sm ghost', onclick: () => downloadIcs(b) }, 'Add to calendar'),
    el('button', { class: 'btn sm warn', onclick: () => confirmCancel(b, live) }, live ? 'End early' : 'Cancel')));
  return el('div', { class: 'card hl' }, kids);
}
function mineCard() {
  const d = S.data, up = liveMine().sort((a, b) => a.start - b.start);
  const past = d.mine.filter(b => !(b.status === 'active' && b.end > now())).reverse();
  const rows = up.concat(past).slice(0, 12);
  const label = { active: 'Booked', cancelled: 'Cancelled', ended: 'Finished', done: 'Finished' };
  return el('div', { class: 'card' }, el('h2', null, 'My bookings'),
    rows.length ? rows.map(b => el('div', { class: 'item' }, el('div', { class: 'row sb' }, el('div', null, el('div', { class: 'mono' }, hm(b.start) + ' – ' + hm(b.end)), el('div', { class: 'small muted' }, dayName(b.start, true))), el('span', { class: 'tag ' + (b.status === 'active' && b.end > now() ? 'active' : '') }, b.status === 'active' && b.end > now() ? 'Booked' : (label[b.status] || b.status))))) : el('div', { class: 'muted' }, 'Nothing yet.'));
}
function openBook(t) {
  const r = S.data.rules, t0 = now();
  const ok = n => {
    for (let x = t; x < t + n * MIN; x += SLOT) {
      if (wibHour(x) < r.openStartHour || wibHour(x) >= r.openEndHour) return false;
      if (S.data.busy.some(b => b[0] < x + SLOT && x < b[1])) return false;
      if (liveMine().some(b => b.start < x + SLOT && x < b.end)) return false;
      if (x > t0 + r.daysAhead * DAY) return false;
    }
    return true;
  };
  const opts = []; for (let n = 30; n <= r.maxDurationMin; n += 30) opts.push(n);
  let pick = ok(60) && r.maxDurationMin >= 60 ? 60 : 30, err = '', busy = false;
  const body = () => [el('h2', null, 'Book ' + dayName(t, true)),
    el('div', { class: 'mono', style: 'font-size:1.4rem;font-weight:700' }, hm(t) + ' – ' + hm(t + pick * MIN)),
    el('div', { class: 'small muted' }, 'How long? Longer options grey out when someone else has the next slot.'),
    el('div', { class: 'chips' }, opts.map(n => el('button', { class: 'chip', 'aria-pressed': String(n === pick), disabled: !ok(n), onclick: () => { pick = n; draw(); } }, dur(n)))),
