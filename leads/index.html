<style>
:root{
  --bg:#FFFFFF; --panel:#F7F8FA; --line:#ECEEF2; --line2:#F1F2F4; --field:#F3F4F6;
  --ink:#0F172A; --ink2:#334155; --ink3:#475569; --muted:#64748B; --faint:#94A3B8;
  --accent:#2F6FED; --accent-ink:#1D4ED8; --accent-soft:#E8EEFC; --accent-bg:#F5F8FF;
  --hot:#EA580C; --hot-soft:#FFEDD5; --warm:#F59E0B; --warm-ink:#B45309; --warm-soft:#FEF3C7; --cool:#CBD5E1;
  --late:#DC2626; --late-soft:#FEE2E2; --good:#15803D; --good-soft:#DCFCE7; --wa:#16A34A; --wa-hover:#15803D;
  --r:10px; --r2:12px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
button,input,textarea{font:inherit;color:inherit}
a{color:var(--accent)}a:hover{color:var(--accent-ink)}
.app{min-height:100vh;display:flex}
.side{display:none}
.listcol{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.detailcol{display:none}
/* coach header */
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:36px;height:36px;flex:0 0 36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700}
.who .n{font-weight:700;font-size:16px;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .s{font-size:12px;color:var(--muted)}
.as-aj{font-size:12px;color:var(--warm-ink);background:var(--warm-soft);border-radius:8px;padding:6px 10px;display:flex;gap:8px;align-items:center;justify-content:space-between}
.listhead{padding:calc(14px + env(safe-area-inset-top,0px)) 16px 12px;display:grid;gap:12px;border-bottom:1px solid var(--line);background:var(--bg);position:sticky;top:0;z-index:5}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:0;border-radius:999px;background:var(--field);color:var(--ink2);padding:7px 12px;font-size:13px;font-weight:500;white-space:nowrap;cursor:pointer;min-height:34px}
.chip[aria-pressed=true]{background:var(--ink);color:#fff;font-weight:600}
.search{width:100%;height:38px;border:0;border-radius:8px;background:var(--field);padding:0 12px;outline:none}
.search:focus{box-shadow:0 0 0 2px var(--accent-soft)}
.bar1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar1 h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}
.seg{display:inline-flex;background:var(--field);border-radius:8px;padding:3px}
.seg button{border:0;background:transparent;border-radius:6px;padding:4px 10px;font-size:12px;font-weight:500;color:var(--muted);cursor:pointer;min-height:28px}
.seg button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
/* rows */
.rows{display:flex;flex-direction:column}
.lr{display:flex;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line2);cursor:pointer;background:var(--bg);border-left:3px solid transparent;text-align:left;width:100%;border-top:0;border-right:0}
.lr:hover{background:#FAFBFC}
.lr[aria-current=true]{background:var(--accent-bg);border-left-color:var(--accent)}
.dot{width:8px;height:8px;flex:0 0 8px;border-radius:50%;margin-top:6px;background:var(--cool)}
.dot.hot{background:var(--hot)}.dot.warm{background:var(--warm)}.dot.good{background:var(--good)}
.lr .b{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:2px}
.lr .t{display:flex;justify-content:space-between;gap:8px}
.lr .t b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc{font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.sc.hot{color:var(--hot)}.sc.warm{color:var(--warm-ink)}.sc.good{color:var(--good)}
.l2{color:var(--ink3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3{color:var(--faint);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.l3 .late{color:var(--late)}
.l3 .due{color:var(--warm-ink);font-weight:600}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.foot{padding:16px;color:var(--faint);font-size:12px;line-height:1.6}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline;font-size:inherit}
.mobile-cta{position:sticky;bottom:0;padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(255,255,255,0),#fff 30%);}
/* buttons */
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:var(--r);height:44px;padding:0 16px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--panel);color:var(--ink)}
.btn.wa{background:var(--wa);border-color:var(--wa);color:#fff;font-weight:600}
.btn.wa:hover{background:var(--wa-hover);color:#fff}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:600}
.btn.pri:hover{background:#1E293B;color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.full{width:100%}
.btn[disabled]{opacity:.5;cursor:default}
/* detail */
.dt{display:flex;flex-direction:column;gap:16px;padding:20px}
.dt-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.dt-h h2{margin:0;font-size:24px;font-weight:700;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.dt-h .f{color:var(--muted);margin-top:4px}
.urgbig{display:flex;flex-direction:column;align-items:flex-end;flex:0 0 auto}
.urgbig b{font-size:30px;line-height:1;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
.urgbig b.hot{color:var(--hot)}.urgbig b.warm{color:var(--warm-ink)}
.urgbig span{font-size:12px;color:var(--muted);margin-top:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.stages{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:2px;background:var(--field);border-radius:var(--r);padding:3px}
.stages button{border:0;background:transparent;border-radius:8px;padding:8px 10px;font-size:13px;color:var(--muted);cursor:pointer;white-space:nowrap;min-height:36px}
.stages button[aria-pressed=true]{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(15,23,42,.08)}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.box{border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.box h3{margin:0;font-size:11px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;display:flex;justify-content:space-between;gap:8px}
.bars{display:flex;flex-direction:column;gap:8px;font-size:13px}
.brow{display:grid;grid-template-columns:112px minmax(0,1fr) 28px;align-items:center;gap:10px}
.trk{height:6px;border-radius:6px;background:#F1F5F9;overflow:hidden}
.fil{height:6px;border-radius:6px}
.brow .v{text-align:right;color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:6px 14px;font-size:13px}
.kv .k{color:var(--muted)}
.kv .v{overflow-wrap:anywhere}
.why{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--ink3)}
.why span:last-child{font-variant-numeric:tabular-nums;color:var(--muted)}
.qbtns{display:flex;gap:6px;flex-wrap:wrap}
.field{width:100%;border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 12px;min-height:40px;outline:none}
.field:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.field{min-height:72px;resize:vertical}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;min-height:36px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent)}
.note{display:flex;flex-direction:column;gap:2px;padding:8px 0;border-top:1px solid var(--line2);font-size:13px}
.note:first-child{border-top:0;padding-top:0}
.note .t{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums}
.pill{display:inline-flex;align-items:center;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:500;background:var(--field);color:var(--ink3);white-space:nowrap}
.pill.late{background:var(--late-soft);color:var(--late)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.blue{background:var(--accent-soft);color:var(--accent-ink)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.saving{font-size:12px;color:var(--muted);min-height:16px}
.msgbox{min-height:220px}
.qscore{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.qscore b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.qscore span{color:var(--warm-ink);font-size:13px;font-weight:500}
.sheettop{display:flex;justify-content:flex-end;padding:8px 12px 0}
.wrap{white-space:normal}
/* banner, sheet */
#banner{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:80;width:min(560px,calc(100% - 24px))}
.banner{border-radius:12px;padding:12px 14px;font-size:13px;line-height:1.45;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:0 8px 24px rgba(15,23,42,.14);border:1px solid}
.banner.err{background:#FEF2F2;border-color:#FECACA;color:#991B1B}
.banner.warn{background:#FFFBEB;border-color:#FDE68A;color:#92400E}
.banner.ok{background:#F0FDF4;border-color:#BBF7D0;color:#166534}
.sheet-bg{position:fixed;inset:0;background:rgba(15,23,42,.35);display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{background:#fff;width:100%;max-width:640px;border-radius:18px 18px 0 0;max-height:94vh;overflow:auto;overscroll-behavior:contain;padding-bottom:env(safe-area-inset-bottom,0px)}
.grab{width:36px;height:4px;border-radius:4px;background:#E2E8F0;margin:8px auto 0}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--accent-soft);border-top-color:var(--accent);border-radius:50%;animation:sp .8s linear infinite;vertical-align:-1px}
@keyframes sp{to{transform:rotate(360deg)}}
/* sidebar */
.side .navi{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;padding:9px 10px;border-radius:8px;color:var(--ink2);cursor:pointer;text-align:left;font-size:14px}
.side .navi:hover{background:#EEF0F3}
.side .navi[aria-pressed=true]{background:var(--accent-soft);color:var(--accent-ink);font-weight:600}
.side .navi .c{color:var(--muted);font-variant-numeric:tabular-nums}
.side .navi[aria-pressed=true] .c{color:var(--accent-ink)}
.side .navi .c.alert{color:var(--hot);font-weight:600}
.kpi{padding:12px 10px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.kpi b{display:block;font-size:20px;color:var(--ink);font-variant-numeric:tabular-nums}
/* admin board */
.board{max-width:1100px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top,0px)) 16px 40px;display:flex;flex-direction:column;gap:16px;width:100%}
.board h1{margin:0;font-size:24px;letter-spacing:-.02em}
.crow{border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;display:grid;gap:10px}
.crow .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.nums{display:flex;gap:18px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.nums b{display:block;font-size:18px;color:var(--ink);font-variant-numeric:tabular-nums}
.nums b.hot{color:var(--hot)}
@media (min-width:768px){
  .app{height:100vh;overflow:hidden}
  .listcol{flex:0 0 360px;border-right:1px solid var(--line);overflow:auto}
  .detailcol{display:block;flex:1 1 auto;min-width:0;overflow:auto}
  .dt{padding:24px 28px 40px;max-width:900px}
  .mobile-cta{display:none}
  .crow{grid-template-columns:minmax(0,1fr) auto;align-items:center}
}
@media (min-width:1024px){
  .side{display:flex;flex-direction:column;gap:2px;flex:0 0 228px;background:var(--panel);border-right:1px solid var(--line);padding:18px 12px;overflow:auto}
  .side .who{padding:0 4px 16px}
  .listcol{flex-basis:380px}
  .listcol .who-m, .listcol .chips{display:none}
  .grid2{grid-template-columns:repeat(2,minmax(0,1fr))}
  .dt-h h2{font-size:26px}
}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
</style>

<body>
<div id="root"></div>
<div id="sheet"></div>
<div id="banner" role="alert" aria-live="polite"></div>
<script>
/* Leads portal. The server (apps-script/Code.gs, "LEADS PORTAL") decides what each link may see:
   a coach's link only ever receives that coach's leads. This page only shows what the server sends. */
const API = 'https://script.google.com/macros/s/AKfycbzHYCy85pcm4xrpc_WEtsaBsibqSqL1nnCM9J73-kLUhlQXbolvuyQogj7fnDmW17WiRg/exec';
const API_V = 1;
const MIN = 60000, HOUR = 3600000, DAY = 86400000;

/* ---------- helpers ---------- */
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  if (props) for (const k in props) {
    const v = props[k];
    if (k === 'class') n.className = v;
    else if (k === 'value') n.value = v;
    else if (k === 'checked') n.checked = !!v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else if (v === true) n.setAttribute(k, '');
    else if (v !== false && v != null) n.setAttribute(k, v);
  }
  kids.flat(Infinity).forEach(c => { if (c == null || c === false) return; n.append(c.nodeType ? c : document.createTextNode(String(c))); });
  return n;
}
const $ = id => document.getElementById(id);
function put(node, ...kids) { node.replaceChildren(...kids.flat(Infinity).filter(Boolean)); }
function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
const pad = n => String(n).padStart(2, '0');
function ymd(ms) { const d = new Date(ms); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function ago(ms) {
  const d = now() - ms;
  if (d < HOUR) return Math.max(1, Math.round(d / MIN)) + ' min';
  if (d < DAY) return Math.round(d / HOUR) + ' h';
  const n = Math.floor(d / DAY); return n + (n === 1 ? ' day' : ' days');
}
function when(ms) { return new Date(ms).toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }); }
function niceDay(s) {
  if (!s) return '';
  if (s === S.today) return 'today';
  const t = new Date(s + 'T00:00:00').getTime(), td = new Date(S.today + 'T00:00:00').getTime(), diff = Math.round((t - td) / DAY);
  if (diff === 1) return 'tomorrow';
  if (diff === -1) return 'yesterday';
  return new Date(t).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
}
function addDays(n) { return ymd(new Date(S.today + 'T00:00:00').getTime() + n * DAY); }

/* ---------- state ---------- */
const S = { key: '', admin: '', viewCoach: '', data: null, board: null, filter: 'waiting', q: '', open: '', sel: '', compose: false, sort: load('ld-sort') || 'urgent', skew: 0, today: ymd(Date.now()), lastOk: 0 };
const now = () => Date.now() + S.skew;
const OPEN = ['New', 'Contacted', 'Consult booked', 'Consult done'];

function readKeys() {
  const h = new URLSearchParams((location.hash || '').replace(/^#/, ''));
  if (h.get('k')) store('ld-key', h.get('k'));
  if (h.get('admin')) store('ld-admin', h.get('admin'));
  if (h.get('l')) S.open = h.get('l');
  S.key = load('ld-key'); S.admin = load('ld-admin');
  if (h.get('admin')) S.key = '';           /* AJ opening his own board on a phone that also has a coach link */
  /* Keep the key in the address, so "Add to Home Screen" works; drop the one-time lead id. */
  const keep = h.get('admin') ? '#admin=' + h.get('admin') : (S.key ? '#k=' + S.key : (S.admin ? '#admin=' + S.admin : ''));
  try { history.replaceState(null, '', location.pathname + keep); } catch (e) {}
}
const isAdmin = () => !!S.admin && !S.key;

/* ---------- server ---------- */
class ApiError extends Error { constructor(msg, code) { super(msg); this.code = code; } }
async function api(payload, opts) {
  const body = Object.assign({ kind: 'leads', k: isAdmin() ? S.admin : S.key }, isAdmin() && S.viewCoach && payload.a.indexOf('a_') !== 0 ? { coach: S.viewCoach } : {}, payload);
  const ctl = new AbortController();
  const timer = setTimeout(() => ctl.abort(), 30000);
  let text;
  try {
    const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body), signal: ctl.signal, redirect: 'follow', keepalive: !!(opts && opts.keepalive) });
    text = await res.text();
  } catch (e) {
    throw new ApiError(e && e.name === 'AbortError' ? 'The server took too long to answer, so this may not be saved. Please try again.' : 'Cannot reach the server. Check your internet connection. This was not saved.', 'NET');
  } finally { clearTimeout(timer); }
  let j;
  try { j = JSON.parse(text); } catch (e) {
    if (/lead logger is running/.test(text)) throw new ApiError('The leads server has not been updated yet. Coach AJ needs to deploy the new version of the script.', 'SETUP');
    throw new ApiError('The server sent an unexpected reply, so it may be busy or down. Nothing was changed. Please try again in a minute.', 'HTML');
  }
  if (!j.ok) throw new ApiError(j.msg || 'Something went wrong. Please try again.', j.code);
  if (j.now) S.skew = j.now - Date.now();
  if (j.v && j.v !== API_V) throw new ApiError('This page is out of date. Please close it and open your link again.', 'VERSION');
  return j;
}
/* Work that could not reach the server is kept on this phone and sent again, so a tap is never lost silently. */
function pending() { try { return JSON.parse(load('ld-pending') || '[]'); } catch (e) { return []; } }
function setPending(p) { store('ld-pending', p.length ? JSON.stringify(p) : null); }
async function flushPending() {
  const p = pending(); if (!p.length || isAdmin()) return;
  const left = [];
  for (const job of p) {
    try { const r = await api(job); mergeLead(r.lead); }
    catch (e) { if (e.code === 'NET' || e.code === 'HTML' || e.code === 'BUSY') left.push(job); }
  }
  setPending(left);
  if (left.length) banner('warn', left.length + ' change' + (left.length > 1 ? 's are' : ' is') + ' saved on this phone only and will be sent when the connection is back.');
}

/* ---------- loading ---------- */
async function refresh(quiet) {
  if (!S.key && !S.admin) return;
  if (!quiet) { S.loading = true; render(); }
  try {
    if (isAdmin() && !S.viewCoach) S.board = await api({ a: 'a_overview' });
    else { S.data = await api({ a: 'list' }); S.today = S.data.today || S.today; }
    S.lastOk = Date.now();
    if ($('banner').textContent.indexOf('Cannot reach') === 0) banner();
  } catch (e) {
    if (e.code === 'AUTH') { if (!isAdmin()) { store('ld-key', null); S.key = ''; } else { store('ld-admin', null); S.admin = ''; } S.data = null; S.board = null; }
    showError(e);
  }
  S.loading = false;
  render();
  if (S.open && S.data) { const sid = S.open; S.open = ''; const L = S.data.leads.find(x => x.sid === sid); if (L) { if (wide()) { S.filter = 'all'; } showLead(L); } else banner('warn', 'That lead is not in your list. It may belong to another coach, or the link is old.'); }
}
function mergeLead(L) {
  if (!L || !S.data) return;
  const i = S.data.leads.findIndex(x => x.sid === L.sid);
  if (i >= 0) S.data.leads[i] = L;
  S.data.stats = statsOf(S.data.leads);
}
function statsOf(leads) {
  const o = { waiting: 0, late: 0, due: 0, active: 0, customers: 0, notNow: 0 };
  leads.forEach(L => {
    if (L.stage === 'New') { o.waiting++; if (now() - L.ts > DAY) o.late++; }
    else if (L.stage === 'Customer') o.customers++;

/* ---------- urgency: who to message first ---------- */
/* 0-100. Built from how strong the quiz signal is, how soon they want to start, how much they have already tried,
   and timing (a fresh uncontacted lead, or a follow-up that is due). Customers and "Not now" drop to the bottom. */
function urgency(L) {
  const why = [];
  if (L.stage === 'Customer') return { score: 0, label: 'Customer', cls: 'good', why: [['Already a customer', 0]] };
  const add = (pts, txt) => { pts = Math.round(pts); if (pts) why.push([txt, pts]); return pts; };
  let s = 0;
  if (L.plateau) s += add(20, 'Stuck on a plateau');
  else if (L.total != null) s += add((100 - L.total) * 0.35, 'Quiz signal ' + L.total + '/100' + (L.total < 50 ? ' (strong)' : ''));
  const st = String(L.start || '');
  s += add(/^secepatnya/i.test(st) ? 25 : /bulan ini/i.test(st) ? 18 : /1.3 bulan/i.test(st) ? 8 : /lihat/i.test(st) ? 2 : 10,
    st ? 'Wants to start: ' + ({ 'Secepatnya': 'as soon as possible', 'Dalam bulan ini': 'this month', 'Cuma lihat-lihat dulu': 'just exploring' }[st] || st) : 'Start time not given');
  const tried = String(L.tried || '').split(',').map(x => x.trim()).filter(x => x && !/belum pernah/i.test(x));
  if (tried.length) s += add(Math.min(3, tried.length) * 3, 'Tried ' + tried.length + ' method' + (tried.length > 1 ? 's' : '') + ' before');
  if (L.stage === 'New') {
    const h = (now() - L.ts) / HOUR;
    s += add(h < 1 ? 31 : h < 6 ? 28 : h < 24 ? 24 : h < 72 ? 18 : 12, 'Not contacted, came in ' + ago(L.ts) + ' ago');
  } else if (L.stage === 'Not now') {
    if (L.next && L.next <= S.today) s = add(30, 'Not now, but follow-up is due'); else return { score: 0, label: 'Not now', cls: '', why: [['Marked Not now', 0]] };
  } else {
    if (L.next && L.next < S.today) s += add(26, 'Follow-up overdue (' + niceDay(L.next) + ')');
    else if (L.next === S.today) s += add(22, 'Follow-up due today');
    else if (!L.next) s += add(14, 'No next follow-up set');
    else s += add(6, 'Next follow-up ' + niceDay(L.next));
  }
  s = Math.max(0, Math.min(100, s));
  return { score: s, label: s >= 75 ? 'Hot' : s >= 55 ? 'Warm' : 'Cool', cls: s >= 75 ? 'bad' : s >= 55 ? 'warn' : 'blue', why: why };
}

      el('div', { class: 'box' }, el('h3', null, el('span', null, 'Next follow-up'), el('span', null, L.next ? (L.next < S.today ? 'overdue · ' : '') + niceDay(L.next) : 'not set')),
        el('div', { class: 'qbtns' }, el('button', { class: 'btn sm', onclick: () => setNext(addDays(1)) }, 'Tomorrow'), el('button', { class: 'btn sm', onclick: () => setNext(addDays(3)) }, 'In 3 days'), el('button', { class: 'btn sm', onclick: () => setNext(addDays(7)) }, 'Next week'), L.next ? el('button', { class: 'btn sm', onclick: () => setNext('') }, 'Clear') : null),
        el('input', { class: 'field', type: 'date', value: L.next || '', 'aria-label': 'Follow-up date', onchange: async e => afterSave(await save(L, { next: e.target.value }, status)) })),
      el('div', { class: 'box' }, el('h3', null, 'Checklist'),
        (S.data.checks || []).map(c => el('label', { class: 'chk' }, el('input', { type: 'checkbox', checked: L.checks.includes(c), onchange: async e => {
          const next = (S.data.checks || []).filter(x => x === c ? e.target.checked : L.checks.includes(x));
          const r = await save(L, { checks: next }, status); if (r) afterSave(r); else e.target.checked = !e.target.checked; } }), c)))),
    el('div', { class: 'box' }, el('h3', null, 'Notes'),
      L.notes.length ? el('div', null, L.notes.slice().reverse().map(n => el('div', { class: 'note' }, el('span', { class: 't' }, n.t), el('span', null, n.x)))) : el('div', { class: 'l3' }, 'No notes yet.'),
      noteBox,
      el('div', null, el('button', { class: 'btn pri', onclick: async () => { const t = noteBox.value.trim(); if (!t) { noteBox.focus(); return; } afterSave(await save(L, { note: t }, status)); } }, 'Add note'))),
    el('div', { class: 'grid2' },
      el('div', { class: 'box' }, el('h3', null, el('span', null, 'Why urgency is ' + u.score), el('span', null, u.label)), u.why.map(w => el('div', { class: 'why' }, el('span', null, w[0]), w[1] ? el('span', null, '+' + w[1]) : null))),
      el('div', { class: 'box' }, el('h3', null, 'Contact'),
        kv([['WhatsApp', L.wa ? '+' + L.wa : ''], ['Email', L.email ? el('a', { href: 'mailto:' + L.email }, L.email) : ''], ['Instagram', L.ig && L.ig !== '-' ? el('a', { href: 'https://instagram.com/' + L.ig.replace(/^@/, ''), target: '_blank', rel: 'noopener' }, L.ig) : ''], ['Came from', L.src]]))))];
}
function composeNodes(L) {
  const box = el('textarea', { class: 'field msgbox', 'aria-label': 'WhatsApp message' });
  box.value = message(L);
  const back = () => { if (wide()) { S.compose = false; render(); } else openLead(L); };
  const go = el('button', { class: 'btn wa full', type: 'button', onclick: () => { markContacted(L); openWhatsApp(L.wa, box.value); setTimeout(back, 300); } }, 'Open WhatsApp');
  return el('div', { class: 'dt' },
    el('div', { class: 'dt-h' }, el('div', null, el('h2', null, 'Message ' + firstName(L.name)), el('div', { class: 'f' }, 'Written from their quiz answers. Change anything before you send it.')), el('button', { class: 'btn sm', onclick: back }, 'Back')),
    box, go,
    el('div', { class: 'l3', style: 'white-space:normal' }, 'Opening WhatsApp marks this lead Contacted, with the time, so your reply speed is counted.'));
}

/* ---------- AJ's speed board ---------- */
function renderBoard() {
  const b = S.board;
  document.title = 'Leads speed board';
  if (!b) { put($('root'), el('div', { class: 'empty', style: 'width:100%' }, S.loading ? [el('span', { class: 'spin' }), ' Loading…'] : '')); return; }
  const tot = b.coaches.reduce((a, c) => { a.w += c.stats.waiting; a.l += c.stats.late; return a; }, { w: 0, l: 0 });
  const share = c => 'Hi ' + c.name + ', this is your private leads page. Only your own leads are in it. Open it, then tap Share and "Add to Home Screen" so it is one tap away. Please don\'t share this link with anyone.\n\n' + c.link;
  put($('root'), el('div', { class: 'board' },
    el('div', null, el('h1', null, 'Leads speed board'), el('div', { class: 'l3', style: 'white-space:normal;font-size:13px' }, tot.w + ' leads not contacted across the team' + (tot.l ? ', ' + tot.l + ' waiting over a day' : '') + '. Only you can see this page.')),
    b.coaches.map(c => {
      const s = c.stats;
      return el('div', { class: 'crow' },
        el('div', { style: 'display:grid;gap:10px;min-width:0' },
          el('div', { class: 'who' }, el('div', { class: 'av', 'aria-hidden': 'true' }, initial(c.name)), el('div', null, el('div', { class: 'n' }, c.name), el('div', { class: 's' }, (s.median != null ? 'Median first reply ' + s.median + ' h' : 'No first replies yet') + ' · ' + (s.last ? 'active ' + ago(s.last) + ' ago' : 'not opened yet')))),
          el('div', { class: 'nums' },
            el('div', null, el('b', { class: s.waiting ? 'hot' : '' }, s.waiting), 'not contacted'), el('div', null, el('b', { style: s.late ? 'color:var(--late)' : '' }, s.late), 'over 24 h'),
            el('div', null, el('b', null, s.due), 'due'), el('div', null, el('b', null, s.active), 'in progress'), el('div', null, el('b', null, s.customers), 'customers'), el('div', null, el('b', null, s.total), 'total'))),
        el('div', { class: 'acts' },
          el('button', { class: 'btn sm pri', onclick: () => { S.viewCoach = c.code; S.filter = 'waiting'; S.q = ''; S.data = null; S.sel = ''; render(); refresh(); } }, 'Open leads'),
          c.link ? el('button', { class: 'btn sm wa', type: 'button', onclick: () => openWhatsApp(c.wa, share(c)) }, 'Send link') : null,
          c.link ? el('button', { class: 'btn sm', onclick: e => copy(c.link, e.target) }, 'Copy link') : null,
          el('button', { class: 'btn sm', onclick: () => rotate(c) }, c.link ? 'New link' : 'Make link')));
    }),
    Object.keys(b.orphans || {}).length ? el('div', { class: 'box' }, el('h3', null, 'Leads with no portal'),
      el('div', { class: 'l3', style: 'white-space:normal' }, 'These coach names on leads don’t match an approved coach, so nobody sees these leads. Usually the coach is hidden, not set up yet, or changed their display name.'),
      Object.keys(b.orphans).map(n => el('div', null, n + ': ' + b.orphans[n] + ' lead' + (b.orphans[n] > 1 ? 's' : '')))) : null,
    el('div', { class: 'foot', style: 'padding:0' }, S.lastOk ? 'Updated ' + new Date(S.lastOk).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + '. ' : '', el('button', { class: 'linkbtn', onclick: () => refresh() }, 'Refresh'))));
}
async function copy(text, btn) {
  try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied'; setTimeout(() => { btn.textContent = 'Copy link'; }, 2000); }
  catch (e) { banner('warn', 'Could not copy automatically. Here is the link: ' + text); }
}
function rotate(c) {
  sheet(el('div', { class: 'dt' }, el('h2', { style: 'margin:0' }, (c.link ? 'New link for ' : 'Make a link for ') + c.name + '?'),
    el('div', null, c.link ? 'Their current link stops working right away. You then send them the new one.' : 'This makes their private leads link. You then send it to them.'),
    el('div', { class: 'acts' },
      el('button', { class: 'btn pri', onclick: async e => { e.target.disabled = true; try { await api({ a: 'a_rotate', coach: c.code }); closeSheet(); banner('ok', 'Done. Tap "Send link" to send ' + c.name + ' the new link.'); refresh(true); } catch (err) { closeSheet(); showError(err); } } }, c.link ? 'Yes, make a new link' : 'Make link'),
      el('button', { class: 'btn', onclick: closeSheet }, 'Cancel'))));
}

/* ---------- boot ---------- */
function render() {
  const lc = document.querySelector('.listcol'), keep = lc ? lc.scrollTop : 0;
  if (!S.key && !S.admin) {
    put($('root'), el('div', { class: 'board' }, el('h1', null, 'Leads'), el('div', { class: 'box' }, el('h3', null, 'Open your personal link'), el('div', null, 'This page needs the private link Coach AJ sent you. Please open that link again, or ask Coach AJ for a new one.'))));
    return;
  }
  if (isAdmin() && !S.viewCoach) renderBoard(); else renderCoach();
  const lc2 = document.querySelector('.listcol'); if (lc2 && keep) lc2.scrollTop = keep;
}
wideMq.addEventListener('change', () => { if (wide() && $('sheet').firstChild) put($('sheet')); document.body.style.overflow = ''; render(); });
readKeys();
render();
refresh().then(flushPending);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - S.lastOk > 60000) { flushPending().then(() => refresh(true)); } });
window.addEventListener('hashchange', () => { readKeys(); S.data = null; S.board = null; S.viewCoach = ''; render(); refresh(); });
</script>
