<style>
section{padding-block:clamp(48px,9vw,96px)}
.hero{padding-block:clamp(40px,8vw,88px) clamp(40px,7vw,72px);display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:clamp(28px,5vw,56px);align-items:center}
.hero h1 em{font-style:normal;color:var(--hl)}
.hero .copy{display:grid;gap:18px}
.hero .ctas{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
.hero .meta{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.85rem;color:var(--muted)}
.hero .meta span::before{content:"✓ ";color:var(--accent);font-weight:800}
.signal{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px;display:grid;gap:14px;box-shadow:0 24px 48px -32px rgba(20,50,44,.35)}
.signal .top{display:flex;justify-content:space-between;align-items:center}
.signal .label{font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.sig{display:grid;grid-template-columns:110px minmax(0,1fr) 34px;gap:10px;align-items:center;font-size:.88rem;font-weight:600}
.sig .bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.sig .bar i{display:block;height:100%;border-radius:99px;background:var(--good)}
.sig .bar i.w{background:var(--warm)}
.sig b{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:700}
.signal .foot{font-size:.78rem;color:var(--muted);border-top:1px solid var(--line);padding-top:12px}
@media (max-width:860px){ .hero{grid-template-columns:1fr} }

.alt{background:var(--sand);border-block:1px solid var(--line)}
.head{display:grid;gap:12px;max-width:680px;margin-bottom:clamp(24px,4vw,40px)}
.pains{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.pain{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;align-content:start}
.pain q{font-family:var(--f-display);font-size:1.08rem;font-weight:600;color:var(--head);line-height:1.35;quotes:"“" "”"}
.pain p{font-size:.9rem;color:var(--muted)}
.notyou{margin-top:22px;font-family:var(--f-display);font-size:clamp(1.2rem,3vw,1.5rem);font-weight:600;color:var(--accent)}
@media (max-width:760px){ .pains{grid-template-columns:1fr} }

.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.rung{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:10px;align-content:start;text-decoration:none;color:inherit;transition:transform .15s,border-color .15s}
a.rung:hover{transform:translateY(-2px);border-color:var(--accent)}
.rung .ico{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.rung .ico svg{width:22px;height:22px}
.rung h3{font-size:1.05rem}
.rung p{font-size:.9rem;color:var(--muted)}
.rung .go{font-weight:700;font-size:.88rem;color:var(--accent);margin-top:auto}
.rung .tag{position:absolute;top:16px;right:16px;font-size:.68rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.rung.soon{background:transparent;border-style:dashed}
.rung.soon .tag{background:var(--warm-soft);color:var(--warm)}
.rung.soon .ico{background:var(--warm-soft);color:var(--warm)}
.rung.feature{grid-column:span 2;background:#1E3A8A;color:#fff;border-color:#1E3A8A}
.rung.feature h3{color:#fff}
.rung.feature .go{color:#FDBA74!important}
.rung.feature p{color:#fff;opacity:.85}

.rung.feature .ico{background:rgba(255,255,255,.16);color:#fff}
.rung.feature .tag{background:rgba(255,255,255,.18);color:#fff}
@media (max-width:860px){ .ladder{grid-template-columns:1fr 1fr} }
@media (max-width:560px){ .ladder{grid-template-columns:1fr} .rung.feature{grid-column:auto} }

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;counter-reset:s}
.stepc{border-top:2px solid var(--accent);padding-top:16px;display:grid;gap:8px;align-content:start}
.stepc .n{font-family:var(--f-display);font-size:2.4rem;line-height:1;color:var(--accent)}
.stepc p{font-size:.92rem;color:var(--muted)}
@media (max-width:760px){ .steps{grid-template-columns:1fr} }
.fine{margin-top:22px;font-size:.82rem;color:var(--muted);max-width:720px}

.coach{display:grid;grid-template-columns:200px minmax(0,1fr);gap:clamp(20px,4vw,40px);align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:28px;padding:clamp(20px,4vw,36px)}
.avatar{width:200px;aspect-ratio:1;border-radius:24px;background:var(--accent-soft);display:grid;place-items:center;overflow:hidden;font-family:var(--f-display);font-size:3.4rem;color:var(--accent)}
.avatar img{width:100%;height:100%;object-fit:cover}
.coach .copy{display:grid;gap:12px}
.coach blockquote{margin:0;font-family:var(--f-body);font-weight:500;color:var(--head);font-size:clamp(1.05rem,2vw,1.2rem);line-height:1.6}
.coach .who{font-size:.9rem;color:var(--muted)}
@media (max-width:640px){ .coach{grid-template-columns:1fr} .avatar{width:120px;font-size:2.4rem} }

.door{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:center;border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,30px)}
.door p{color:var(--muted);font-size:.95rem;margin-top:6px}
@media (max-width:640px){ .door{grid-template-columns:1fr} }

.faq{display:grid;gap:10px;max-width:780px}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.faq summary{font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:12px}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:1.3rem;line-height:1;color:var(--accent)}
.faq details[open] summary::after{content:"−"}
.faq details p{margin-top:10px;color:var(--muted);font-size:.94rem}

.final{text-align:center;display:grid;gap:16px;justify-items:center}
.final p{max-width:560px}
</style>
</head>

let lang=ALV.getLang();
function render(){
 const t=T[lang], c=ALV.coach(), code=ALV.coachCode();
 document.documentElement.lang=lang;
 document.querySelectorAll('[data-i18n]').forEach(el=>{const v=t[el.dataset.i18n]; if(typeof v==='string') el.innerHTML=v;});
 document.querySelectorAll('.lang button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===lang));
 document.getElementById('tagline').textContent=t.tagline(c.name);
 const suffix=code!==ALV.DEFAULT?'#'+code:'';
 document.querySelectorAll('.js-test').forEach(a=>a.href='test/'+suffix);
 const av=document.getElementById('avatar');
 av.innerHTML=c.photo?`<img src="images/${c.photo}" alt="${c.name}" width="200" height="200" loading="lazy">`:c.name.replace(/^Coach\s+/i,'').slice(0,2).toUpperCase();
 document.getElementById('coachStory').textContent=c.story?c.story[lang]:'';
 document.getElementById('coachWho').textContent=`${c.name} · ${c.city||''}`;
 document.getElementById('doorBtn').href=`https://wa.me/${c.wa}?text=${encodeURIComponent(t.doorMsg(c.name))}`;
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-lang]'); if(b){lang=b.dataset.lang;ALV.setLang(lang);render();}});
window.addEventListener('hashchange',render);
render();
</script>
