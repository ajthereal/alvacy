<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cek Sinyal Badan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: calm, centered, mobile-first wellness page. One column of content, soft sage accent, generous white space. Works for any coach on the team. */
:root{
  --bg:#F6F6F2; --surface:#FFFFFF; --ink:#1C2726; --muted:#5E6B69; --line:#E2E5DF;
  --accent:#2E6B5E; --accent-ink:#FFFFFF; --accent-soft:#E4EFEA; --sand:#EFEBE2;
  --good:#2F7D57; --warn:#A86F0E; --bad:#B4432F;
  --good-soft:#E1F0E7; --warn-soft:#F5EBD6; --bad-soft:#F6E1DC;
  --f-display:"Fraunces",Georgia,"Times New Roman",serif;
  --f-body:"Plus Jakarta Sans","Segoe UI",system-ui,sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111716; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#29332F;
    --accent:#7CC4B0; --accent-ink:#0E1F1B; --accent-soft:#1C3430; --sand:#161D1B;
    --good:#5FC491; --warn:#E2B14F; --bad:#EE8370;
    --good-soft:#15302A; --warn-soft:#33291A; --bad-soft:#3A201B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111716; --surface:#18201F; --ink:#E8EEEC; --muted:#9AA8A5; --line:#29332F;
  --accent:#7CC4B0; --accent-ink:#0E1F1B; --accent-soft:#1C3430; --sand:#161D1B;
  --good:#5FC491; --warn:#E2B14F; --bad:#EE8370;
  --good-soft:#15302A; --warn-soft:#33291A; --bad-soft:#3A201B;
  color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;text-wrap:balance}
h1,h2{font-family:var(--f-display);font-weight:600;letter-spacing:-.015em;line-height:1.12}
h1{font-size:clamp(2.1rem,6vw,3.4rem)}
h2{font-size:clamp(1.5rem,4vw,2.1rem)}
h3{font-size:1.05rem;font-weight:700;line-height:1.3}
p{margin:0}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.narrow{max-width:720px}
.center{text-align:center}
.kicker{font-size:.78rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.lede{font-size:1.08rem;color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px;border-radius:10px}

.top{padding-block:16px;border-bottom:1px solid var(--line);background:var(--bg)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:grid;line-height:1.25}
.brand b{font-family:var(--f-display);font-size:1.15rem;font-weight:600}
.brand span{font-size:.8rem;color:var(--muted)}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--surface)}
.lang button{border:0;background:none;padding:5px 12px;border-radius:999px;font-size:.78rem;font-weight:700;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:16px 26px;font-weight:700;font-size:1rem;text-decoration:none;transition:transform .15s ease,filter .15s ease}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.quiet{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
.ghost{border:0;background:none;color:var(--muted);font-weight:600;padding:6px 0}
.ghost:hover{color:var(--ink)}

.hero{padding-block:clamp(40px,8vw,88px) clamp(32px,6vw,56px);display:grid;gap:22px;justify-items:center}
.hero h1 em{font-style:italic;color:var(--accent)}
.hero .lede{max-width:56ch}
.ticks{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:8px 20px;font-size:.88rem;color:var(--muted)}
.ticks li{display:flex;align-items:center;gap:7px}
.ticks svg{color:var(--accent)}

.areas{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;padding-bottom:clamp(40px,7vw,72px)}
.area{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 16px;display:grid;gap:10px;justify-items:center;text-align:center;align-content:start}
.area .ic{width:44px;height:44px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.area p{font-size:.85rem;color:var(--muted);line-height:1.45}

.band{padding-block:clamp(44px,7vw,80px)}
.band.alt{background:var(--sand)}
.stack{display:grid;gap:14px}
.mirror{list-style:none;margin:24px 0 0;padding:0;display:grid;gap:10px;text-align:left}
.mirror li{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.closer{margin-top:22px;font-family:var(--f-display);font-size:1.25rem;font-weight:600}
.steps{list-style:none;margin:28px 0 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:14px;text-align:left}
.step{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;display:grid;gap:8px;align-content:start}
.step .n{width:30px;height:30px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.step p{color:var(--muted);font-size:.95rem}
.coach{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:left;margin-top:24px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-display);font-size:1.5rem;font-weight:600}
.coach p{color:var(--muted);font-size:.95rem}
.faq{display:grid;gap:10px;margin-top:24px;text-align:left}
.faq details{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.faq summary{font-weight:700;cursor:pointer}
.faq details p{margin-top:10px;color:var(--muted)}
.final{padding-block:clamp(44px,7vw,80px)}
.final .box{background:var(--accent);color:var(--accent-ink);border-radius:24px;padding:clamp(28px,5vw,48px);display:grid;gap:18px;justify-items:center;text-align:center}
.final .btn{background:var(--accent-ink);color:var(--accent)}
.foot{padding-block:26px 34px;font-size:.82rem;color:var(--muted);border-top:1px solid var(--line)}
.foot .wrap{display:grid;gap:6px;text-align:center}

.quiz{padding-block:18px 64px}
.qbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.qcount{font-size:.88rem;color:var(--muted);font-weight:600}
.segs{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin:12px 0 22px}
.seg{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.seg i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(22px,4vw,36px);display:grid;gap:12px}
.qcard h2{font-size:clamp(1.35rem,3.6vw,1.8rem)}
.why{font-size:.92rem;color:var(--muted)}
.opts{display:grid;gap:10px;margin-top:8px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:15px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--bg);font-weight:500;transition:border-color .15s ease,background .15s ease}
.opt:hover{border-color:var(--accent)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt.multi .dot{border-radius:6px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .dot{border-color:var(--accent);background:var(--accent)}
.opt.on .dot::after{content:"";width:6px;height:6px;border-radius:50%;background:var(--accent-ink)}
.qnext{justify-self:start;margin-top:6px}
.inter{min-height:58vh;display:grid;place-content:center;text-align:center;gap:14px;padding-block:40px}
.inter .tick{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-inline:auto}
.inter p{color:var(--muted)}

.results{padding-block:24px 64px;display:grid;gap:22px}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:clamp(24px,4vw,36px);display:grid;gap:14px;justify-items:center;text-align:center}
.ring{width:150px;height:150px}
.ring .track{stroke:var(--line)}
.ring .val{stroke:var(--accent);transition:stroke-dashoffset 1s ease}
.ring text{fill:var(--ink);font-family:var(--f-body);font-weight:700}
.ring .sub{fill:var(--muted);font-size:11px;font-weight:500}
.locked{position:relative;border-radius:24px;overflow:hidden}
.locked .behind{filter:blur(7px);opacity:.55;pointer-events:none;user-select:none}
.locked .gate{position:absolute;inset:0;display:grid;place-items:center;padding:16px;background:color-mix(in srgb,var(--bg) 35%,transparent)}
.detail{display:grid;gap:18px}
.pillars{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:clamp(18px,3vw,26px)}
.pil{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:12px;align-items:center}
.pil-name{font-weight:600}
.pil-bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.pil-bar i{display:block;height:100%;border-radius:5px}
.pil-val{display:flex;gap:8px;align-items:center;justify-content:flex-end}
.chip{font-size:.7rem;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.c-good{background:var(--good-soft);color:var(--good)}.c-warn{background:var(--warn-soft);color:var(--warn)}.c-bad{background:var(--bad-soft);color:var(--bad)}
.b-good{background:var(--good)}.b-warn{background:var(--warn)}.b-bad{background:var(--bad)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tip{border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:8px;background:var(--surface)}
.tip p{color:var(--muted)}
.gatecard{width:min(100%,520px);background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,4vw,30px);display:grid;gap:14px;box-shadow:0 24px 48px -28px rgba(20,40,36,.45)}
.gatecard .lede{font-size:.98rem}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{display:grid;gap:6px;min-width:0}
.field label,.field legend{font-size:.82rem;font-weight:600;color:var(--muted);padding:0}
.field input,.field select{font:inherit;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.field fieldset{border:0;margin:0;padding:0;display:grid;gap:8px}
.radio{display:flex;gap:10px;align-items:center;font-size:.95rem}
.radio input{accent-color:var(--accent);width:18px;height:18px}
.full{grid-column:1/-1}
.err{color:var(--bad);font-size:.85rem;font-weight:600}
.phone{display:grid;grid-template-columns:auto 1fr;gap:8px}
.phone select{width:auto}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;color:var(--muted);line-height:1.5}
.check input{accent-color:var(--accent);width:18px;height:18px;margin-top:2px;flex:none}
.small{font-size:.82rem;color:var(--muted)}
.copyline{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.linkbtn{border:0;background:none;color:var(--accent);font-weight:700;padding:0;text-decoration:underline}
.sel{user-select:all;font-weight:600}
.next{background:var(--accent-soft);border-radius:var(--r);padding:20px;display:grid;gap:6px}
.disc{font-size:.85rem;color:var(--muted)}

@media (max-width:900px){ .areas{grid-template-columns:repeat(3,1fr)} }
@media (max-width:760px){ .steps,.focus{grid-template-columns:1fr} .areas{grid-template-columns:repeat(2,1fr)} }
@media (max-width:520px){
  .form{grid-template-columns:1fr}
  .pil{grid-template-columns:1fr auto}
  .pil-bar{grid-column:1/-1;grid-row:2}
  .locked .gate{align-items:start;padding-top:24px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const svg = (p,s=22)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;

let lang = 'id';
try{ const s = localStorage.getItem('csb-lang'); if(s==='en'||s==='id') lang = s; }catch(e){}
const S = {view:'landing', i:0, a:{}, interFor:null, lead:{name:'',city:0,mode:0,cc:'62',wa:'',email:'',consent:false}, unlocked:false};

const app = document.getElementById('app');

const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const coach = () => COACHES[coachCode()];

function setLang(l){
  lang = l;
  try{ localStorage.setItem('csb-lang', l); }catch(e){}
  document.documentElement.lang = l;
  document.getElementById('l-id').setAttribute('aria-pressed', l==='id');
  document.getElementById('l-en').setAttribute('aria-pressed', l==='en');
  render();
}

function render(){
  const u = UI[lang], c = coach();
  document.getElementById('tagline').textContent = u.tagline(c.name);
  if(S.view==='landing') app.innerHTML = landing(u,c);
  else if(S.view==='quiz') app.innerHTML = quiz(u);
  else if(S.view==='inter') app.innerHTML = inter(u);
  else app.innerHTML = results(u,c);
  if(S.view==='results') requestAnimationFrame(()=>{ const v=app.querySelector('.ring .val'); if(v) v.style.strokeDashoffset = v.dataset.off; });
}

function landing(u,c){
  const initials = c.name.replace(/^Coach\s+/i,'').slice(0,2).toUpperCase();
  return `
<section class="wrap narrow hero center">
  <p class="kicker">${u.eyebrow}</p>
  <h1>${u.h1}</h1>
  <p class="lede">${u.lede}</p>
  <button class="btn primary" data-act="start">${u.cta} <span aria-hidden="true">→</span></button>
  <ul class="ticks">${u.ticks.map(t=>`<li>${svg(CHECK,16)}${t}</li>`).join('')}</ul>
</section>
<section class="wrap areas">${u.areas.map((a,i)=>`<div class="area"><span class="ic">${svg(ICONS[i])}</span><h3>${a[0]}</h3><p>${a[1]}</p></div>`).join('')}</section>
<section class="band alt"><div class="wrap narrow center">
  <h2>${u.patH}</h2>
  <ul class="mirror">${u.pat.map(p=>`<li>${p}</li>`).join('')}</ul>
  <p class="closer">${u.patClose}</p>
</div></section>
<section class="band"><div class="wrap center">
  <p class="kicker">${u.howK}</p>
  <h2 style="margin-top:8px">${u.howH}</h2>
  <ol class="steps">${u.steps.map((s,i)=>`<li class="step"><span class="n">${i+1}</span><h3>${s[0]}</h3><p>${s[1]}</p></li>`).join('')}</ol>
</div></section>
<section class="band alt"><div class="wrap narrow center">
  <p class="kicker">${u.coachK}</p>
  <div class="coach">
    <span class="avatar" aria-hidden="true">${esc(initials)}</span>
    <div class="stack" style="gap:4px"><h3>${esc(c.name)}</h3>${c.story?`<p>${L(c.story)}</p>`:''}<p class="small">${u.coachLine}</p></div>
  </div>
</div></section>
<section class="band"><div class="wrap narrow center">
  <h2>${u.faqH}</h2>
  <div class="faq">${u.faq(c.name).map(f=>`<details><summary>${f[0]}</summary><p>${f[1]}</p></details>`).join('')}</div>
</div></section>
<section class="final"><div class="wrap"><div class="box">
  <h2>${u.finalH}</h2>
  <button class="btn" data-act="start">${u.cta} <span aria-hidden="true">→</span></button>
</div></div></section>
<footer class="foot"><div class="wrap"><span>${u.foot}</span><span>${u.team}</span></div></footer>`;
}

function quiz(u){
  const q = Q[S.i], sec = SECTIONS[q.s];
  const segs = SECTIONS.map((s,k)=>{
    const idx = Q.map((x,j)=>x.s===k?j:-1).filter(j=>j>=0);
    const doneN = idx.filter(j=>j<S.i).length;
    return `<span class="seg"><i style="width:${doneN/idx.length*100}%"></i></span>`;
  }).join('');
  const ans = S.a[S.i];
  const opts = q.o.map((o,idx)=>{
    const on = q.multi ? (Array.isArray(ans)&&ans.includes(idx)) : ans===idx;
    return `<button class="opt${q.multi?' multi':''}${on?' on':''}" data-act="pick" data-v="${idx}" aria-pressed="${on}"><span class="dot" aria-hidden="true"></span><span>${L(o)}</span></button>`;
  }).join('');
  const canNext = q.multi && Array.isArray(ans) && ans.length>0;
  return `
<section class="quiz wrap narrow">
  <div class="qbar"><button class="ghost" data-act="back">← ${u.back}</button><span class="qcount num">${S.i+1} / ${Q.length}</span></div>
  <div class="segs" aria-hidden="true">${segs}</div>
  <article class="qcard">
    <p class="kicker">${L(sec.n)}</p>
    <h2>${L(q.q)}</h2>
    <p class="why">${u.why} ${L(q.h)}${q.multi?' '+u.multiHint:''}</p>
    <div class="opts" role="group" aria-label="${esc(L(q.q))}">${opts}</div>
    ${q.multi?`<button class="btn primary qnext" data-act="next"${canNext?'':' disabled'}>${u.next} <span aria-hidden="true">→</span></button>`:''}
  </article>
</section>`;
}

function inter(u){
  const k = S.interFor, left = SECTIONS.length-1-k;
  return `
<section class="inter wrap narrow">
  <div class="tick">${svg(CHECK,28)}</div>
  <h2>${L(SECTIONS[k].n)} ${u.done}</h2>
  <p>${u.left(left)}</p>
  <div><button class="btn primary" data-act="cont">${u.cont} <span aria-hidden="true">→</span></button></div>
</section>`;
}

function scores(){
  const out = {};
  SECTIONS.forEach((s,k)=>{
    if(!s.scored) return;
    let sum=0, max=0;
    Q.forEach((q,j)=>{ if(q.s===k){ max+=3; const a=S.a[j]; if(typeof a==='number') sum+=q.o[a].v; } });
    out[s.k] = Math.round(sum/max*100);
  });
  const vals = Object.values(out);
  out.total = Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);
  return out;
}
const BANDS = [
  {min:80,id:['Mesin kamu jalan bagus','Banyak kebiasaan kamu sudah mendukung. Fokusnya sekarang menjaga konsistensi dan memastikan otot tidak turun.'],en:['Your engine is running well','Most of your habits already work for you. The focus now is staying consistent and keeping your muscle.']},
  {min:60,id:['Ada sinyal kecil','Dasarnya sudah oke, tapi ada satu atau dua area yang diam-diam menahan progress kamu.'],en:['A few small signals','Your base is solid, but one or two areas are quietly holding you back.']},
  {min:40,id:['Sinyalnya jelas','Beberapa kebiasaan sedang bekerja melawan kamu. Kabar baiknya, semua ini bisa diubah satu per satu.'],en:['Clear signals','Several habits are working against you. The good news is all of this can change, one step at a time.']},
  {min:0,id:['Badan kamu sedang minta perhatian','Banyak area yang sedang berat, dan itu bukan salah kamu. Mulai dari satu hal kecil. Kalau ada keluhan kesehatan, bicarakan juga dengan dokter.'],en:['Your body is asking for attention','A lot is weighing on you right now, and it isn’t your fault. Start with one small thing. If you have health concerns, talk to your doctor too.']}
];
const level = v => v>=75?'good':v>=50?'warn':'bad';
const mark = v => v>=75?'🟢':v>=50?'🟡':'🔴';

function detailHTML(u, sc){
  const scored = SECTIONS.filter(s=>s.scored);
  const pil = scored.map(s=>{ const v=sc[s.k], l=level(v); return `<div class="pil"><span class="pil-name">${L(s.n)}</span><span class="pil-bar"><i class="b-${l}" style="width:${Math.max(v,3)}%"></i></span><span class="pil-val"><span class="num">${v}</span><span class="chip c-${l}">${u.chip[l]}</span></span></div>`; }).join('');
  const weakest = [...scored].sort((a,b)=>sc[a.k]-sc[b.k]).slice(0,2);
  return `<div class="detail">
    <div class="pillars">${pil}</div>
    <h2 style="font-size:1.4rem">${u.focusH}</h2>
    <div class="focus">${weakest.map(s=>`<div class="tip"><span class="chip c-${level(sc[s.k])}" style="justify-self:start">${L(s.n)} · ${sc[s.k]}</span><p>${L(s.tip)}</p></div>`).join('')}</div>
  </div>`;
}

function results(u,c){
  const sc = scores();
  const band = BANDS.find(b=>sc.total>=b.min)[lang];
  const C = 2*Math.PI*52, off = C*(1-sc.total/100);
  const lead = S.lead;
  const top = `
  <div class="scorecard">
    <p class="kicker">${u.resK}</p>
    <svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${u.score} ${sc.total}/100">
      <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="10"/>
      <circle class="val" cx="60" cy="60" r="52" fill="none" stroke-width="10" stroke-linecap="round" transform="rotate(-90 60 60)" stroke-dasharray="${C.toFixed(2)}" stroke-dashoffset="${C.toFixed(2)}" data-off="${off.toFixed(2)}"/>
      <text x="60" y="64" text-anchor="middle" font-size="32">${sc.total}</text>
      <text class="sub" x="60" y="82" text-anchor="middle">/ 100</text>
    </svg>
    <h1 style="font-size:clamp(1.8rem,5vw,2.5rem)">${band[0]}</h1>
    <p class="lede" style="max-width:52ch">${band[1]}</p>
  </div>`;
  if(S.unlocked){
    return `<section class="results wrap narrow">${top}${detailHTML(u,sc)}
      <div class="next"><h3>${u.nextH(c.name)}</h3><p class="small">${u.nextP}</p></div>
      <p class="disc">${u.disc}</p>
      <div><button class="btn quiet" data-act="retake">${u.retake}</button></div>
    </section>`;
  }
  const cityOpts = u.cities.map((x,i)=>`<option value="${i}"${lead.city==i?' selected':''}>${x}</option>`).join('');
  const modeOpts = u.modes.map((m,i)=>`<label class="radio"><input type="radio" name="mode" id="mode-${i}" value="${i}"${lead.mode==i?' checked':''}> ${m}</label>`).join('');
  return `<section class="results wrap narrow">${top}
    <div class="locked">
      <div class="behind" aria-hidden="true">${detailHTML(u,sc)}</div>
      <div class="gate">
        <div class="gatecard">
          <h2 style="font-size:1.45rem">${u.gateH}</h2>
          <p class="lede">${u.gateP(c.name)}</p>
          <form class="form" id="leadform" novalidate>
            <div class="field full"><label for="f-name">${u.fName}</label><input id="f-name" autocomplete="name" value="${esc(lead.name)}"></div>
            <div class="field full"><label for="f-wa">${u.fWa}</label><div class="phone"><select id="f-cc" aria-label="Country code">${[['62','ID +62'],['65','SG +65'],['60','MY +60']].map(x=>`<option value="${x[0]}"${lead.cc===x[0]?' selected':''}>${x[1]}</option>`).join('')}</select><input id="f-wa" type="tel" inputmode="tel" autocomplete="tel-national" placeholder="812 3456 7890" value="${esc(lead.wa)}"></div></div>
            <div class="field full"><label for="f-email">${u.fEmail}</label><input id="f-email" type="email" inputmode="email" autocomplete="email" placeholder="nama@email.com" value="${esc(lead.email)}"></div>
            <div class="field"><label for="f-city">${u.fCity}</label><select id="f-city">${cityOpts}</select></div>
            <div class="field full"><fieldset><legend>${u.fMode}</legend>${modeOpts}</fieldset></div>
            <label class="check full"><input type="checkbox" id="f-consent"${lead.consent?' checked':''}> <span>${u.consentCheck(c.name)}</span></label>
            <p class="err full" id="f-err" hidden></p>
            <button class="btn primary full" type="submit">${u.submit} <span aria-hidden="true">→</span></button>
            <p class="small full">${u.privacy}</p>
          </form>
        </div>
      </div>
    </div>
    <p class="disc">${u.disc}</p>
  </section>`;
}

function syncLead(){
  const v=id=>document.getElementById(id);
  if(v('f-name')) S.lead.name = v('f-name').value.trim();
  if(v('f-cc')) S.lead.cc = v('f-cc').value;
  if(v('f-wa')) S.lead.wa = v('f-wa').value.trim();
  if(v('f-email')) S.lead.email = v('f-email').value.trim();
  if(v('f-city')) S.lead.city = +v('f-city').value;
  const md=document.querySelector('input[name="mode"]:checked'); if(md) S.lead.mode = +md.value;
  if(v('f-consent')) S.lead.consent = v('f-consent').checked;
}
function fullWa(){
  let d = S.lead.wa.replace(/\D/g,'');
  if(d.startsWith(S.lead.cc) && d.length > 10) d = d.slice(S.lead.cc.length);
  d = d.replace(/^0+/,'');
  return (d.length>=8 && d.length<=13) ? S.lead.cc + d : '';
}
function leadError(u){
  if(!S.lead.name) return [u.errName,'f-name'];
  if(!fullWa()) return [u.errWa,'f-wa'];
  if(!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(S.lead.email)) return [u.errEmail,'f-email'];
  if(!S.lead.consent) return [u.errConsent,'f-consent'];
  return null;
}

function logLead(status, withContact){
  if(!LEADS_URL) return;
  const sc = scores(), u = UI[lang];
  const band = BANDS.find(b=>sc.total>=b.min)[lang][0];
  const pick = j => { const a=S.a[j]; if(Array.isArray(a)) return a.map(x=>L(Q[j].o[x])).join(', '); return typeof a==='number' ? L(Q[j].o[a]) : ''; };
  const d = {sid:SID, status, coach:coach().name, lang, total:sc.total, band,
    food:sc.food, energy:sc.energy, sleep:sc.sleep, move:sc.move, trend:sc.trend,
    age:pick(0), gender:pick(1), goal:pick(2), start:pick(3), tried:pick(4),
    name: withContact ? S.lead.name : '', wa: withContact ? fullWa() : '', email: withContact ? S.lead.email : '', consent: withContact ? 'Ya' : '', city: withContact ? u.cities[S.lead.city] : '', mode: withContact ? u.modes[S.lead.mode] : ''};
  try{ fetch(LEADS_URL, {method:'POST', mode:'no-cors', keepalive:true, headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify(d)}).catch(()=>{}); }catch(e){}
}

function advance(){
  const cur = Q[S.i];
  if(S.i === Q.length-1){ S.view='results'; render(); scrollTo(0,0); logLead('Selesai kuis', false); return; }
  if(Q[S.i+1].s !== cur.s){
    S.interFor = cur.s; S.view='inter'; render();
    clearTimeout(timer); timer = setTimeout(()=>{ if(S.view==='inter'){ S.i++; S.view='quiz'; render(); } }, 1600);
    return;
  }
  S.i++; render();
}

document.addEventListener('click', e=>{
  const lb = e.target.closest('[data-lang]');
  if(lb){ if(S.view==='results') syncLead(); setLang(lb.dataset.lang); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const act = b.dataset.act;
  if(act==='start'){ S.view='quiz'; S.i=0; render(); scrollTo(0,0); }
  else if(act==='back'){ clearTimeout(timer); if(S.i>0){ S.i--; render(); } else { S.view='landing'; render(); } }
  else if(act==='pick'){
    const v=+b.dataset.v, q=Q[S.i];
    if(q.multi){ const arr=Array.isArray(S.a[S.i])?S.a[S.i]:[]; S.a[S.i]=arr.includes(v)?arr.filter(x=>x!==v):[...arr,v]; render(); }
    else { S.a[S.i]=v; render(); clearTimeout(timer); timer=setTimeout(advance,230); }
  }
  else if(act==='next'){ advance(); }
  else if(act==='cont'){ clearTimeout(timer); S.i++; S.view='quiz'; render(); }
  else if(act==='retake'){ S.a={}; S.i=0; S.unlocked=false; S.view='quiz'; render(); scrollTo(0,0); }
});
document.addEventListener('input', e=>{ if(e.target.closest('.gatecard')){ syncLead(); const er=document.getElementById('f-err'); if(er) er.hidden=true; } });
document.addEventListener('submit', e=>{
  if(e.target.id!=='leadform') return;
  e.preventDefault(); syncLead();
  const err = leadError(UI[lang]);
  if(err){ const er=document.getElementById('f-err'); er.textContent=err[0]; er.hidden=false; const f=document.getElementById(err[1]); if(f) f.focus(); return; }
  logLead('Lead masuk', true);
  S.unlocked=true; render(); scrollTo({top:0});
});
document.addEventListener('change', e=>{ if(e.target.closest('.gatecard')) syncLead(); });
window.addEventListener('hashchange', render);

setLang(lang);
</script>

</body>
